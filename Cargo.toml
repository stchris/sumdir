[package]
name = "sumdir"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/stchris/sumdir"
homepage = "https://github.com/stchris/sumdir"
description = "summarize a directory by file type frequency"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
indicatif = "0.17"
infer = "0.19"
itertools = "0.14.0"
jwalk = "0.8"
rayon = "1"
sevenz-rust = "0.6"
tar = "0.4"
zip = "2"

[lints.clippy]
unwrap_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
pre-release-hook = [
  "git",
  "cliff",
  "-o",
  "CHANGELOG.md",
  "--tag",
  "{{version}}",
]
