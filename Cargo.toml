[package]
name = "sumdir"
version = "0.5.0"
edition = "2024"
repository = "https://github.com/stchris/sumdir"
homepage = "https://github.com/stchris/sumdir"
description = "summarize a directory by file type frequency"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
ftm-types = { version = "0.4", features = ["builder"] }
indicatif = "0.18"
infer = "0.19"
itertools = "0.14"
jwalk = "0.8"
rayon = "1"
serde_json = "1.0"
sevenz-rust = "0.6"
sha1 = "0.10"
tar = "0.4"
zip = "8"

[lints.clippy]
unwrap_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
pre-release-hook = [
  "git",
  "cliff",
  "-o",
  "CHANGELOG.md",
  "--tag",
  "{{version}}",
]
